<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Music Studio Cover</title>
</head>
<body>
  <canvas id="canvas" width="1600" height="676"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Gradient background
    const gradient = ctx.createLinearGradient(0, 0, 1600, 676);
    gradient.addColorStop(0, '#1a103c');
    gradient.addColorStop(0.4, '#2d1b4e');
    gradient.addColorStop(0.7, '#4c1d95');
    gradient.addColorStop(1, '#be185d');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1600, 676);
    
    // Floating music notes
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    const notes = ['♪', '♫', '♬', '♩', '🎵', '🎶'];
    ctx.font = '80px Arial';
    for (let i = 0; i < 15; i++) {
      ctx.fillText(notes[i % notes.length], 100 + i * 100, 100 + Math.sin(i) * 50);
    }
    
    // Main title
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 120px "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#be185d';
    ctx.shadowBlur = 30;
    ctx.fillText('🎵 AI Music Studio', 800, 280);
    
    // Subtitle
    ctx.font = '50px "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fbcfe8';
    ctx.fillText('随心音乐 · AI 创作你的歌', 800, 360);
    
    // Divider line
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(400, 400);
    ctx.lineTo(1200, 400);
    ctx.stroke();
    
    // Features
    ctx.font = '32px "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#e9d5ff';
    ctx.shadowBlur = 10;
    const features = ['🎤 AI 写词', '🎼 AI 作曲', '🎶 10+ 种曲风', '🖼️ 歌词图片'];
    for (let i = 0; i < features.length; i++) {
      ctx.fillText(features[i], 400 + i * 260, 480);
    }
    
    // URL
    ctx.font = '36px Arial';
    ctx.fillStyle = '#f9a8d4';
    ctx.fillText('https://ai-music-studio.up.railway.app', 800, 580);
    
    // Save
    const link = document.createElement('a');
    link.download = 'ai-music-studio-cover.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    console.log('Cover image saved!');
  </script>
</body>
</html>
